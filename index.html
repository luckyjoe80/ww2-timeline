<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WW2 Day by Day</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>WW2 <span>Day by Day</span></h1>
      <button id="menu-toggle" class="switcher" aria-controls="picker" aria-haspopup="dialog" title="Switch to another timeline or atlas">
        <span id="timeline-title" class="switcher-title"></span>
        <span class="switcher-caret" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="date-readout">
      <div id="weekday" class="weekday"></div>
      <div id="current-date" class="current-date"></div>
      <div id="war-day" class="war-day"></div>
    </div>
  </header>

  <main class="stage">
    <div id="map" aria-label="World map"></div>
    <div id="minimap" class="minimap" title="Overview: click to move the map here"></div>
    <nav id="map-crumbs" class="map-crumbs" aria-label="Where you are"></nav>

    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="panel-close" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <!-- Timeline picker: by group (groups left, cards right) or all timelines by date on a shared axis. -->
  <div id="picker" class="picker" hidden>
    <div class="picker-backdrop" data-picker-close></div>
    <div class="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="picker-head">
        <h2 id="picker-title">Choose a timeline</h2>
        <div class="picker-tabs" role="tablist" aria-label="View">
          <button role="tab" id="tab-groups" data-view="groups" aria-selected="true">By group</button>
          <button role="tab" id="tab-list" data-view="list" aria-selected="false">All, by date</button>
        </div>
        <input id="picker-search" type="search" placeholder="Search…" aria-label="Search timelines and atlases" autocomplete="off" />
        <button class="picker-close" data-picker-close aria-label="Close">×</button>
      </div>
      <div id="picker-body" class="picker-body" role="tabpanel" aria-labelledby="tab-groups">
        <nav id="picker-groups" class="picker-groups" aria-label="Groups"></nav>
        <div id="picker-items" class="picker-items"></div>
      </div>
      <div id="picker-list" class="picker-list" role="tabpanel" aria-labelledby="tab-list" hidden></div>
    </div>
  </div>

  <footer class="timeline" id="timeline">
    <div class="controls">
      <div class="transport">
        <button id="btn-overview" class="step-btn overview-btn" aria-pressed="false" title="Show every event in this timeline on one map (O)">Overview</button>
        <button id="btn-start" class="step-btn start-btn" title="Start at the first event (Enter)">Start timeline ›</button>
        <button id="btn-prev" class="step-btn">‹ Previous event</button>
        <button id="btn-play" class="play" title="Play / pause (Space)">▶</button>
        <button id="btn-next" class="step-btn">Next event ›</button>
      </div>
    </div>
    <div id="day-strip" class="day-strip" hidden>
      <span id="day-strip-label" class="day-strip-label"></span>
      <div id="day-strip-chips" class="day-strip-chips"></div>
    </div>
    <div class="track-wrap">
      <nav id="track-crumbs" class="track-crumbs" aria-label="Timeline zoom"></nav>
      <div id="track-labels" class="track-labels"></div>
      <div class="track">
        <div id="event-ticks" class="event-ticks"></div>
        <input id="slider" type="range" min="0" step="1" aria-hidden="true" tabindex="-1" />
      </div>
    </div>
    <div id="atlas-bar" class="atlas-bar"></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/catalog.js"></script>
  <script src="data/intros.js"></script>
  <script src="data/wiki.js"></script>
  <script src="data/places.js"></script>
  <script src="data/timelines/road-to-pearl-harbor.js"></script>
  <script src="data/timelines/attack-on-hawaii.js"></script>
  <script src="data/timelines/pearl-harbor-to-guadalcanal.js"></script>
  <script src="data/timelines/road-to-tokyo-bay.js"></script>
  <script src="data/timelines/battle-of-midway.js"></script>
  <script src="data/timelines/pacific-submarines.js"></script>
  <script src="data/timelines/medal-of-honor.js"></script>
  <script src="data/timelines/yamamoto.js"></script>
  <script src="data/timelines/yamato.js"></script>
  <script src="data/timelines/saipan-philippine-sea.js"></script>
  <script src="data/timelines/leyte-gulf.js"></script>
  <script src="data/timelines/iwo-jima.js"></script>
  <script src="data/timelines/guadalcanal.js"></script>
  <script src="data/timelines/malaya-singapore.js"></script>
  <script src="data/timelines/coral-sea.js"></script>
  <script src="data/timelines/tarawa.js"></script>
  <script src="data/timelines/kokoda-track.js"></script>
  <script src="data/timelines/philippines-1941-42.js"></script>
  <script src="data/timelines/okinawa.js"></script>
  <script src="data/timelines/java-sea.js"></script>
  <script src="data/timelines/imphal-kohima.js"></script>
  <script src="data/timelines/firebombing-of-japan.js"></script>
  <script src="data/timelines/kamikaze.js"></script>
  <script src="data/timelines/atomic-bomb.js"></script>
  <script src="data/atlases/b17-production.js"></script>
  <script src="app.js"></script>
</body>
</html>
